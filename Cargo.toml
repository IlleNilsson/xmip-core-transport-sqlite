# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-transport-sqlite"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-transport-sqlite"
description = "SQLite transport: a database file as a queue — a send inserts a row, a receive takes and marks the oldest unclaimed rows in one transaction, and the row is the claim. A xmip-core-transport technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md).
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main" }
# The one real engine. Bundled: the SQLite amalgamation is compiled into the
# crate, so a node needs no SQLite installed beside it.
rusqlite = { version = "0.37", features = ["bundled"] }

[dev-dependencies]
# The loopback payloads the tests drive, from the capability's test
# support and never a production build (ADR-0044).
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main", features = ["test-support"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
