[package]
name = "xmip-core-transport-sqlite"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-transport-sqlite"
description = "SQLite transport: a database file as a queue — a send inserts a row, a receive takes and marks the oldest unclaimed rows in one transaction, and the row is the claim. A xmip-core-transport technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md).
transport = { workspace = true, optional = true }
# The settings this technology declares (xcore::settings), read through
# transport::Configured (ADR-0064, amendment 2026-09-26).
xcore = { workspace = true }
# The one real engine. Bundled: the SQLite amalgamation is compiled into the
# crate, so a node needs no SQLite installed beside it.
rusqlite = { version = "0.41", features = ["bundled"], optional = true }
# A filesystem path as the path of a URI, written once for the estate.
net = { workspace = true, optional = true }

[features]
# The code and its declaration: the transport guide's "The declaration",
# module/core/capability/transport/doc/adding-a-transport.md.
default = ["declaration", "dep:transport", "dep:rusqlite", "dep:net"]
# The declaration alone, not the engine compiled in.
declaration = []

[dev-dependencies]
# The loopback payloads the tests drive, from the capability's test
# support and never a production build (ADR-0044).
transport = { workspace = true, features = ["test-support"] }
# A test's own temporary folder (`file::temporary`); for the tests only.
file = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
